# Checks that Autoinstall.yaml has the shape cloud-init and subiquity require.

name: Validate Autoinstall

on:
  pull_request:
    paths: ["Autoinstall.yaml"]
  push:
    branches: [main]
    paths: ["Autoinstall.yaml"]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check header and top-level key
        run: |
          head -1 Autoinstall.yaml | grep -qx '#cloud-config'
          python3 -c "import yaml; d=yaml.safe_load(open('Autoinstall.yaml')); assert list(d)==['autoinstall'], list(d); assert d['autoinstall']['version']==1"
