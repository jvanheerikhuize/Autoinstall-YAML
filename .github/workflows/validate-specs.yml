# Validates feature specs against specs/schemas/feature-spec.schema.json
# and checks that Autoinstall.yaml parses with the required cloud-config shape.

name: Validate Specifications

on:
  pull_request:
    paths:
      - "specs/**"
      - "Autoinstall.yaml"
      - "scripts/validate-specs.sh"
  push:
    branches: [main]
    paths:
      - "specs/**"
      - "Autoinstall.yaml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install validation tools
        run: pip install --quiet pyyaml jsonschema yamllint

      - name: Validate specs
        run: scripts/validate-specs.sh

      - name: Check Autoinstall.yaml shape
        run: |
          head -1 Autoinstall.yaml | grep -qx '#cloud-config'
          python3 -c "import yaml; d=yaml.safe_load(open('Autoinstall.yaml')); assert list(d)==['autoinstall'], list(d); assert d['autoinstall']['version']==1"
