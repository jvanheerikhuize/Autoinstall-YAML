#cloud-config
# The #cloud-config header is mandatory when this file is delivered
# through cloud-init (cloud-config-url= or ds=nocloud-net). Without it cloud-init ignores
# the payload and the installer silently falls back to interactive mode.
# Target release: Ubuntu 26.04 LTS (Resolute Raccoon); 24.04 LTS remains compatible.
autoinstall:
  version: 1

  # Update the installer itself before proceeding
  refresh-installer:
    update: true
    channel: stable/ubuntu-$REL

  # Auto-install OEM kernel if recommended for this hardware
  oem:
    install: auto

  # Locale, keyboard, timezone — automated, no prompts
  locale: en_US.UTF-8
  keyboard:
    layout: us
    variant: ''
  timezone: Europe/Amsterdam

  # Only these two steps require user input — everything else is automated
  interactive-sections:
    - network
    - identity

  # Lean desktop base — no bloatware, add only what is needed
  source:
    id: ubuntu-desktop-minimal

  # LVM disk layout
  storage:
    layout:
      name: lvm

  # Developer base packages and Dell Latitude 5400 hardware support
  packages:
    # Developer base
    - git
    - curl
    - wget
    - build-essential
    - ca-certificates
    - gnupg
    - gufw
    # Intel CPU microcode — security and stability for 8th Gen Whiskey Lake
    - intel-microcode
    # Intel thermal daemon — prevents throttling on Dell Latitude 5400
    - thermald
    # ALSA UCM configs — correct audio profiles for the ALC256 codec
    # Note: SOF firmware is bundled in linux-firmware (included with ubuntu-desktop-minimal)
    - alsa-ucm-conf
    # Thunderbolt 3 device manager
    - bolt
    # Signed firmware updates via Dell LVFS — BIOS, EC, dock firmware
    - fwupd-signed
    # Node.js runtime and npm — Ubuntu 26.04 ships Node 22 LTS, 24.04 ships Node 18
    - nodejs
    - npm

  # Developer and security snap packages
  snaps:
    # Visual Studio Code — primary code editor (classic snap: needs filesystem access)
    - name: code
      channel: stable
      classic: true
    # AppArmor prompting client — handles permission prompts for confined apps
    - name: prompting-client
      channel: stable
    # Ubuntu Desktop Security Center — GUI for managing AppArmor and security policies
    - name: desktop-security-center
      channel: stable

  # Pre-seed: ensure UFW is enabled after installation
  debconf-selections: |
    ufw ufw/enable boolean true

  # Install third-party drivers (GPU, Wi-Fi, etc.)
  drivers:
    install: true

  # Install restricted media codecs
  codecs:
    install: true

  # Always use the official Ubuntu archive; disable GeoIP mirror selection
  apt:
    mirror-selection:
      primary:
        - uri: "http://archive.ubuntu.com/ubuntu"
          arches: [amd64, i386]
        - uri: "http://ports.ubuntu.com/ubuntu-ports"
          arches: [s390x, arm64, armhf, powerpc, ppc64el, riscv64]
    fallback: abort
    geoip: false

  # Apply all security and general updates before first boot
  updates: all

  # Enable UFW firewall with default-deny inbound policy
  # Dotfiles provisioning (stage 2) — github.com/jvanheerikhuize/dotfiles is public with
  # install.sh at its root (verified 2026-11-16). Uncomment once the command has been tested
  # in a VM. Failures are logged, never swallowed.
  late-commands:
    - curtin in-target -- ufw --force enable
    # - curtin in-target -- sh -c "U=$(awk -F: '$3>=1000 && $3<65534 {print $1; exit}' /etc/passwd) && su - $U -c 'git clone https://github.com/jvanheerikhuize/dotfiles.git ~/.dotfiles && ~/.dotfiles/install.sh' >/var/log/autoinstall-dotfiles.log 2>&1 || echo 'dotfiles provisioning failed, see /var/log/autoinstall-dotfiles.log' >> /var/log/autoinstall-dotfiles.log"

  # Reboot after installation completes
  shutdown: reboot
