# AI Context Configuration
# Configures how AI assistants should interact with this codebase
#
# This file is designed to work with ANY AI coding assistant:
# - Claude Code (Anthropic)
# - GitHub Copilot
# - Cursor
# - Aider
# - Cody (Sourcegraph)
# - Continue.dev
# - Any other AI coding tool
#
# Each tool may use this differently - see integration settings below.

version: "1.0"

# Project identification
project:
  name: "Ubuntu Developer Workstation Autoinstall"
  type: "configuration"  # application | library | cli | api | template | configuration
  language: "yaml"  # Primary configuration language
  maturity: "development"  # development | production | maintenance

# Context loading configuration
context:
  # Files AI should read first for context
  entry_points:
    - ".ai/CONTEXT.md"  # Always start here
    - ".ai/specs/SPEC.md"
    - ".ai/architecture/ARCHITECTURE.md"

  # Additional context files to include
  include:
    - ".ai/architecture/PATTERNS.md"
    - "specs.config.yaml"
    - "package.json"  # or equivalent for your language

  # Files/patterns to exclude from context
  exclude:
    - "node_modules/**"
    - "dist/**"
    - "*.lock"
    - "*.log"
    - ".env*"

  # Maximum context size preferences
  limits:
    max_file_size_kb: 100  # Skip files larger than this
    max_files_in_context: 20  # Limit concurrent files

# Code generation preferences
code_generation:
  # Style preferences
  style:
    indent: 2
    quotes: "single"  # single | double
    semicolons: true
    trailing_commas: "es5"

  # What to include in generated code
  include:
    types: true
    jsdoc: "public_only"  # none | public_only | all
    error_handling: true
    logging: true

  # What to avoid
  avoid:
    comments_for_obvious_code: true
    over_engineering: true
    premature_optimization: true

  # Testing requirements
  testing:
    require_tests: true
    test_framework: "jest"  # jest | vitest | mocha | pytest | etc.
    minimum_coverage: 80
    test_location: "colocated"  # colocated | separate

# Behavior preferences
behavior:
  # How AI should approach tasks
  approach:
    ask_before_major_changes: true
    prefer_minimal_changes: true
    explain_trade_offs: true
    suggest_alternatives: false  # Set to true if you want options

  # Response format preferences
  responses:
    include_file_paths: true
    include_line_numbers: true
    format: "concise"  # concise | detailed | verbose

  # Safety preferences
  safety:
    confirm_deletions: true
    confirm_security_changes: true
    warn_breaking_changes: true
    require_tests_for_logic: true

# Domain-specific terminology
# Helps AI understand your business domain
domain:
  # Ubiquitous language for the Ubuntu autoinstall domain
  terms:
    - term: "Autoinstall"
      definition: "Ubuntu's mechanism for fully or partially unattended installation using a YAML configuration file processed by subiquity"
      synonyms: ["autoinstall YAML", "unattended install"]
    - term: "Subiquity"
      definition: "The Ubuntu installer backend that reads and processes the autoinstall YAML file"
      synonyms: ["installer"]
    - term: "Curtin"
      definition: "The storage and command execution backend used by subiquity; used for late-commands via 'curtin in-target'"
      synonyms: []
    - term: "late-commands"
      definition: "YAML section containing shell commands run inside a chroot of the installed system after base installation completes"
      synonyms: ["post-install commands"]
    - term: "interactive-sections"
      definition: "YAML key listing section names where the installer pauses for user input instead of using automated values"
      synonyms: []
    - term: "LVM"
      definition: "Logical Volume Manager — the disk partitioning scheme used for the storage layout"
      synonyms: ["Logical Volume Manager"]
    - term: "ubuntu-desktop-minimal"
      definition: "The minimal Ubuntu Desktop installation source — a lean base without optional default apps"
      synonyms: ["minimal desktop"]

  # Business rules AI must respect
  rules:
    - "Never hardcode credentials (passwords, tokens, keys) in any YAML file"
    - "The identity section must always remain interactive — no default username or password"
    - "Only implement what is covered by an approved spec (status: approved)"
    - "All late-commands must use 'curtin in-target' for chroot execution"
    - "APT mirror fallback must always be set to abort"

# AI CLI Integration Settings
# Configure which AI coding assistants are enabled and their preferences
ai_integrations:
  # Default AI CLI for automation (used by scripts and workflows)
  # Options: auto | claude | aider | copilot | cody | gpt | custom
  default_cli: "auto"

  # Claude Code (Anthropic)
  claude:
    enabled: true
    config_path: ".claude/"  # Claude Code looks for CLAUDE.md here
    model_preference: "claude-sonnet-4-20250514"
    api_key_env: "ANTHROPIC_API_KEY"

  # Aider (AI pair programming)
  aider:
    enabled: true
    model_preference: "gpt-4"  # or claude-3-5-sonnet
    api_key_env: "OPENAI_API_KEY"  # or ANTHROPIC_API_KEY

  # GitHub Copilot
  copilot:
    enabled: true
    workspace_context: true
    api_key_env: "GITHUB_TOKEN"

  # Cursor IDE
  cursor:
    enabled: true
    codebase_indexing: true
    rules_file: ".cursorrules"  # Optional Cursor-specific rules

  # Sourcegraph Cody
  cody:
    enabled: true
    api_key_env: "SRC_ACCESS_TOKEN"
    embeddings: true

  # Continue.dev
  continue:
    enabled: true
    config_path: ".continue/"

  # OpenAI GPT CLI
  gpt:
    enabled: true
    api_key_env: "OPENAI_API_KEY"
    model_preference: "gpt-4-turbo"

  # Custom CLI (for enterprise or specialized tools)
  custom:
    enabled: false
    command: ""  # e.g., "my-enterprise-ai-tool --context"
    api_key_env: "AI_API_KEY"

# Spec-based development settings
specs:
  # How to handle specifications
  require_spec_for_features: true
  auto_implement_approved: true

  # Validation
  validate_against_schema: true
  require_acceptance_criteria: true

# Custom prompts/instructions
# Additional instructions for AI assistants
custom_instructions: |
  When working on this codebase:

  1. ALWAYS read .ai/CONTEXT.md first for project overview
  2. Follow patterns in .ai/architecture/PATTERNS.md
  3. Check .ai/decisions/ for context on past decisions
  4. Implement specs exactly as written - no extras
  5. Write tests for all business logic

  Priority order when making decisions:
  1. Security > Correctness > Performance > Readability

# Environments
environments:
  development:
    debug_logging: true
    verbose_errors: true

  production:
    debug_logging: false
    verbose_errors: false

# Hooks for AI tools (optional)
hooks:
  # Commands to run before/after AI operations
  pre_generation: []
    # - "npm run lint"

  post_generation: []
    # - "npm run format"
    # - "npm run test"
