# Feature Specification: Automated Locale and Timezone
# Validate against: specs/schemas/feature-spec.schema.json

metadata:
  id: "FEAT-0004"
  title: "Automated Locale, Keyboard Layout, and Timezone Configuration"
  version: "1.0.0"
  status: "implemented"
  priority: "medium"
  author: "jerry"
  created_at: "2026-02-24"
  updated_at: "2026-02-24"
  tags:
    - ubuntu
    - autoinstall
    - locale
    - timezone

description:
  summary: |
    Add locale, keyboard layout, and timezone sections to the autoinstall YAML so
    the installer skips those prompts entirely, reducing manual steps from 4 to 2
    (network and identity only).

  problem_statement: |
    Without explicit locale, keyboard, and timezone values in the YAML, the Ubuntu
    Desktop installer pauses and asks the user to select each one. For a machine
    that always uses the same locale and timezone, this is unnecessary friction —
    especially during reinstalls or fleet deployments.

  proposed_solution: |
    Add three top-level sections to Autoinstall.yaml:
    - locale: en_US.UTF-8
    - keyboard: layout us, no variant
    - timezone: Europe/Amsterdam

    These sections are not added to interactive-sections, so the installer
    processes them silently and moves directly to the network step.

  out_of_scope:
    - "Multiple locale support"
    - "Dynamic timezone detection based on IP/GPS"

  dependencies:
    - "FEAT-0001: Base autoinstall configuration"

acceptance_criteria:
  - id: "AC-001"
    given: "The autoinstall YAML is processed"
    when: "The locale section is evaluated"
    then: "The system locale is set to en_US.UTF-8 without prompting the user"
    and:
      - "The locale key is set to en_US.UTF-8"
      - "The locale section is not listed in interactive-sections"

  - id: "AC-002"
    given: "The autoinstall YAML is processed"
    when: "The keyboard section is evaluated"
    then: "The keyboard layout is set to US QWERTY without prompting the user"
    and:
      - "The keyboard layout is set to us"
      - "The keyboard variant is empty"
      - "The keyboard section is not listed in interactive-sections"

  - id: "AC-003"
    given: "The autoinstall YAML is processed"
    when: "The timezone section is evaluated"
    then: "The system timezone is set to Europe/Amsterdam without prompting the user"
    and:
      - "The timezone key is set to Europe/Amsterdam"
      - "The timezone section is not listed in interactive-sections"

  - id: "AC-004"
    given: "All three sections are specified in the YAML"
    when: "The installation completes"
    then: "The only interactive steps are network and identity"
    and:
      - "interactive-sections contains exactly: network, identity"

technical_requirements:
  constraints:
    - "locale, keyboard, and timezone must be top-level keys under autoinstall:"
    - "None of these sections may appear in interactive-sections"
    - "Values must be valid IANA timezone identifiers and IETF locale codes"

testing_requirements:
  unit_tests: false
  integration_tests: true
  e2e_tests: false
  performance_tests: false
  test_scenarios:
    - "Boot ISO with YAML and verify installer goes directly from network to identity (no locale/keyboard/timezone prompts)"
    - "After install, verify: locale -a shows en_US.UTF-8, timedatectl shows Europe/Amsterdam, keyboard layout is us"

rollout:
  rollout_strategy: "immediate"
  rollback_plan: |
    Remove locale, keyboard, and timezone keys from Autoinstall.yaml.
    The installer will resume asking for them interactively.
