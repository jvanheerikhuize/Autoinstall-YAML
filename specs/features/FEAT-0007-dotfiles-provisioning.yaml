# Feature Specification: Dotfiles Repository Provisioning
# Validate against: specs/schemas/feature-spec.schema.json

metadata:
  id: "FEAT-0007"
  title: "Automated Dotfiles Repository Provisioning"
  version: "1.0.0"
  status: "draft"  # draft | review | approved | implemented | deprecated
  priority: "medium"
  author: "jerry"
  created_at: "2026-02-24"
  updated_at: "2026-02-24"
  tags:
    - ubuntu
    - autoinstall
    - dotfiles
    - toolchain
    - late-commands

description:
  summary: |
    After the base system is installed, automatically clone a personal dotfiles
    repository from GitHub and run its install script to finish provisioning
    the developer toolchain — shell config, editor settings, aliases, and any
    post-install tooling that cannot be expressed as an APT package or snap.

  problem_statement: |
    Autoinstall can install packages and snaps, but it cannot configure
    the user environment: shell aliases, git config, editor settings, tool
    version managers (e.g. nvm), and other dotfiles. After every fresh
    install the developer must manually clone and run their dotfiles setup,
    which is an error-prone step that breaks the "zero manual steps after
    first boot" goal.

  proposed_solution: |
    Add a late-command that:
    1. Discovers the installed user account dynamically (since identity is
       collected interactively and the username is not known at YAML-write time)
    2. Clones the dotfiles repository into ~/.dotfiles as that user
    3. Runs the repository's install script (install.sh) as that user

    The repository URL is a configurable constant in Autoinstall.yaml.
    The dotfiles repository must be public (no authentication available
    during late-commands) and must provide an idempotent install.sh at
    its root.

  user_stories:
    - "As a developer, I want my shell config and tool settings to be applied
       automatically so that my environment is ready immediately after first boot"
    - "As a developer, I want my nvm installation and Node version pinning to
       happen automatically so that I don't have to remember the post-install steps"

  dependencies:
    - "FEAT-0001: git must be installed (already satisfied)"
    - "A public GitHub dotfiles repository with an install.sh at root"
    - "install.sh must be idempotent and safe to run as a regular user"

acceptance_criteria:
  - id: "AC-001"
    given: "The autoinstall late-commands phase runs"
    when: "The dotfiles late-command executes"
    then: "The installed user account is discovered dynamically from /etc/passwd"
    and:
      - "The first UID >= 1000 and < 65534 is used (the user created via identity step)"
      - "The command is NOT run as root — it runs via su - <username>"

  - id: "AC-002"
    given: "The user account is discovered"
    when: "The git clone runs"
    then: "The dotfiles repository is cloned to ~/.dotfiles in the user's home directory"
    and:
      - "The repository URL is defined as a constant in the late-command"
      - "The repository must be public (no credentials used)"

  - id: "AC-003"
    given: "The repository is cloned successfully"
    when: "The install script runs"
    then: "install.sh at the repository root is executed as the installed user"
    and:
      - "install.sh is run from within the cloned repository directory"
      - "Failure of install.sh does not abort the autoinstall (|| true)"

  - id: "AC-004"
    given: "The dotfiles repository or install script fails for any reason"
    when: "The late-command exits"
    then: "The autoinstall continues and completes successfully"
    and:
      - "The late-command uses || true to prevent install failure from blocking provisioning"

technical_requirements:
  constraints:
    - "Repository must be public — no SSH keys or tokens available during late-commands"
    - "install.sh must be idempotent (safe to run multiple times)"
    - "Must use su - <user> to run as the installed user, not root"
    - "Must use curtin in-target for chroot execution"

  implementation_notes: |
    Dynamic username discovery pattern (same as FEAT-0006 dialout group):

      U=$(awk -F: '$3>=1000 && $3<65534 {print $1; exit}' /etc/passwd)

    Full late-command:

      curtin in-target -- sh -c "
        U=\$(awk -F: '\$3>=1000 && \$3<65534 {print \$1; exit}' /etc/passwd) &&
        su - \$U -c '
          git clone https://github.com/GITHUB_USER/DOTFILES_REPO.git ~/.dotfiles &&
          ~/.dotfiles/install.sh
        ' || true
      "

    Replace GITHUB_USER/DOTFILES_REPO with the actual repository path before
    approving this spec.

  dotfiles_repo_structure: |
    The dotfiles repository must follow this minimum structure:

      ~/.dotfiles/
      ├── install.sh        # Entry point — run by autoinstall late-command
      ├── README.md
      └── ...               # Dotfiles and configs (organized as preferred)

    Recommended install.sh responsibilities:
    - Link dotfiles into $HOME (via GNU stow or symlinks)
    - Install nvm and pin Node version (if using nvm instead of apt nodejs)
    - Configure git user.name / user.email
    - Set default shell preferences
    - Install any additional tooling not available as apt/snap packages

  testing: |
    Before approving:
    1. Create the dotfiles repository on GitHub
    2. Add install.sh that is idempotent and exits 0 on success
    3. Test the late-command manually on an installed system
    4. Update the spec status to approved and fill in the actual repo URL
