# FEAT-0008: Deployable via cloud-init (cloud-config-url) with one verified install
# Validate against: specs/schemas/feature-spec.schema.json

metadata:
  id: "FEAT-0008"
  title: "Deployable via cloud-init and verified end to end"
  version: "1.0.0"
  status: "review"  # draft | review | approved | implemented | deprecated
  priority: "critical"
  author: "Jerry van Heerikhuize"
  created_at: "2026-11-16"
  updated_at: "2026-11-16"
  tags:
    - cloud-init
    - deployment
    - validation
    - ubuntu-26.04

description:
  summary: |
    Make the advertised deploy path (GRUB kernel parameter
    `autoinstall cloud-config-url=https://tinyurl.com/jvh-autoinstall`) actually work,
    and put one verified unattended install on record.

  problem_statement: |
    Autoinstall.yaml is fetched by cloud-init, not directly by subiquity. cloud-init's
    kernel-command-line handling only stores and uses content that starts with
    `#cloud-config` ("only cloud config user data starting with #cloud-config is
    supported"). The file started with `autoinstall:` so cloud-init ignored it and the
    installer fell back to interactive mode. This was identified in docs/ROADMAP.md
    (2026-07-24, P0) and was still unfixed on main on 2026-11-16.
    - The reference machine (Latitude 5400) was never provisioned from this config.
    - No evidence exists that any version of the config has completed an install.

  proposed_solution: |
    1. Prepend the `#cloud-config` header, keeping the top-level `autoinstall:` key,
       which is exactly the shape subiquity documents for cloud-init delivery.
    2. Boot the current Ubuntu Desktop LTS ISO (26.04.x) in VirtualBox with the
       TinyURL kernel parameter and walk the README post-install checklist.
    3. Record the result as a dated entry under docs/runbooks/.

  out_of_scope:
    - "Full-disk encryption (tracked separately, docs/ROADMAP.md §2.9)"
    - "Dotfiles provisioning (FEAT-0007)"
    - "A reusable VM test harness script (docs/ROADMAP.md item 7)"

  dependencies:
    - "FEAT-0001: Ubuntu Developer Workstation Autoinstall"
    - "VirtualBox on the reference machine (present, VBoxManage in PATH)"

acceptance_criteria:
  - id: "AC-001"
    given: "Autoinstall.yaml is served through the TinyURL (raw GitHub main)"
    when: "cloud-init fetches it from the cloud-config-url kernel parameter"
    then: "The first line of the file is exactly `#cloud-config`"
    and:
      - "The `autoinstall:` key remains the single top-level key below the header"
      - "The file still parses as YAML (yamllint relaxed passes)"

  - id: "AC-002"
    given: "A VirtualBox VM with at least 25 GB disk and 4 GB RAM booted from the Ubuntu Desktop 26.04 LTS ISO"
    when: "The GRUB linux line is extended with `autoinstall cloud-config-url=https://tinyurl.com/jvh-autoinstall`"
    then: "The installer prompts only for network and identity, then completes unattended and reboots"

  - id: "AC-003"
    given: "The VM from AC-002 has rebooted"
    when: "The README post-install checklist is executed"
    then: "All checklist items pass: packages present, snaps listed, UFW active, user has sudo, LVM volume group exists"
    and:
      - "The result is recorded as docs/runbooks/YYYY-MM-DD-verified-install.md with pass/fail per item"

technical_requirements:
  constraints:
    - "No secrets in the YAML (unchanged)"
    - "The ds=nocloud-net;s=<url> path must keep working; it needs the same header"
  security:
    - "cloud-config-url is fetched over plain HTTP GET by cloud-init; the TinyURL redirects to HTTPS raw GitHub, which is acceptable for a public, secret-free file"

testing_requirements:
  unit_tests: false
  integration_tests: true
  e2e_tests: true
  performance_tests: false
  test_scenarios:
    - "Happy path: AC-002 and AC-003 on the 26.04 Desktop ISO"
    - "Regression: the same file served locally via ds=nocloud-net"

rollout:
  rollout_strategy: "immediate"
  rollback_plan: |
    Revert the header commit. The TinyURL points at main, so a revert restores the
    previous (non-working) behaviour immediately.
